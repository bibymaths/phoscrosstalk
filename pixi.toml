[project]
name = "phoscrosstalk"
version = "0.1.0"
description = "Global phospho-crosstalk ODE modeling from PTM databases and time-series phosphorylation data."
authors = ["Abhinav Mishra <mishraabhinav36@gmail.com>"]
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/bibymaths/phoscrosstalk"
repository = "https://github.com/bibymaths/phoscrosstalk"
documentation = "https://github.com/bibymaths/phoscrosstalk/issues"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.11,<3.12"
graphviz = ">=9.0"

[pypi-dependencies]
numpy          = "==2.2.2"
pandas         = ">=2.2,<2.3"
jaxlib         = ">=0.4.30"
diffrax        = "==0.7.2"
optimistix     = ">=0.0.8"
equinox        = ">=0.11.0"
matplotlib     = ">=3.8"
seaborn        = ">=0.13.2"
pynetphorest   = "==0.1.3"
networkx       = ">=3.4.2"
lxml           = ">=6.0.2"
plotly         = ">=6.5.2"
streamlit      = ">=1.54.0"
gravis         = ">=0.1.0"
salib          = ">=1.5.2"
imageio        = ">=2.37.2"
graphviz       = ">=0.21"   # Python binding
rich           = ">=14.3.2"
pyfiglet       = ">=1.0.4"
evosax         = "==0.2.0"
weasyprint     = ">=68.1"
optax          = ">=0.2.8"
ipykernel      = ">=7.2.0"
setuptools     = "<81"
jaxopt         = ">=0.8.5"
jax            = ">=0.8.3"
grpcio         = ">=1.62"
grpcio-tools   = ">=1.62"

[feature.dev.pypi-dependencies]
pytest     = "*"
pytest-cov = "*"
black      = "*"
ruff       = "*"
ipython    = "*"

[feature.dev.tasks]
lint   = "ruff check ."
fmt    = "black ."
test   = "pytest"
cov    = "pytest --cov=phoscrosstalk --cov-report=term-missing --cov-report=xml"

[feature.docs.pypi-dependencies]
mkdocs                   = "*"
mkdocs-material          = "*"
"mkdocstrings[python]"   = "*"
pymdown-extensions       = "*"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"

[environments]
default = { features = [],          solve-group = "main" }
dev     = { features = ["dev"],     solve-group = "main" }
docs    = { features = ["docs"],    solve-group = "main" }

[tasks]
run     = "phoscrosstalk"
app     = "phoscrosstalk-app"