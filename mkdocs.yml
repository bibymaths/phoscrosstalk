      link: https://github.com/bibymaths
      name: GitHub
    - icon: fontawesome/solid/globe
      link: https://bibymaths.github.io
      name: Website
    - icon: fontawesome/solid/envelope
      link: mailto:mishraabhinav36@gmail.com
      name: Email

extra_css:
