[project]
name = "phoscrosstalk"
version = "0.1.0"
description = "Global phospho-crosstalk ODE modeling from PTM databases and time-series phosphorylation data."
authors = [
  { name = "Abhinav Mishra", email = "mishraabhinav36@gmail.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "numpy==2.2.2",
  "pandas>=2.2,<2.3",
  "jaxlib>=0.4.30",
  "diffrax==0.7.2",
  "optimistix>=0.0.8",
  "equinox>=0.11.0",
  "matplotlib>=3.8",
  "seaborn>=0.13.2",
  "pynetphorest==0.1.3",
  "networkx>=3.4.2",
  "lxml>=6.0.2",
  "plotly>=6.5.2",
  "streamlit>=1.54.0",
  "gravis>=0.1.0",
  "salib>=1.5.2",
  "imageio>=2.37.2",
  "graphviz>=0.21",
  "rich>=14.3.2",
  "pyfiglet>=1.0.4",
  "evosax==0.2.0",
  "weasyprint>=68.1",
  "optax>=0.2.8",
  "ipykernel>=7.2.0",
  "setuptools<81",
  "jaxopt>=0.8.5",
  "jax>=0.8.3",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "black",
  "ruff",
  "ipython",
]
posterior = [
  "blackjax>=1.0",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "pymdown-extensions",
]

[project.scripts]
phoscrosstalk = "phoscrosstalk.main:cli"
phoscrosstalk-app = "phoscrosstalk.app_cli:cli"

[project.urls]
homepage = "https://github.com/bibymaths/phoscrosstalk"
repository = "https://github.com/bibymaths/phoscrosstalk"
issues = "https://github.com/bibymaths/phoscrosstalk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = [
  "grpcio-tools>=1.62",
  "grpcio>=1.62",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=phoscrosstalk --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["phoscrosstalk"]
omit = [
    "phoscrosstalk/app.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
