# PhosCrosstalk configuration file
# All runtime options live here; the CLI only accepts --config <path>.

# ---------------------------------------------------------------------------
# [paths]  – input files and output directory
# Required: data, ptm_intra, ptm_inter
# Optional: set to "" or omit the key entirely to disable.
# ---------------------------------------------------------------------------
[paths]
data              = "data_subset/subnetwork_EPHA2_LYN/filtered_input1_subset.csv"
ptm_intra         = "data_curated/processed/ptm_intra.db"
ptm_inter         = "data_curated/processed/ptm_inter.db"
output_dir        = "test_results_dist"
crosstalk_tsv     = ""
rna_data          = "data_subset/subnetwork_EPHA2_LYN/filtered_input3_subset.csv"
tf_net            = "data_subset/subnetwork_EPHA2_LYN/tf_mrna_subset.csv"
kinase_tsv        = "data_subset/subnetwork_EPHA2_LYN/kinase_sites_subset.tsv"
kea_ks_table      = ""
unified_graph_pkl = "data_curated/processed/unified_kinase_graph.gpickle"

# ---------------------------------------------------------------------------
# [model]  – ODE model settings
# ---------------------------------------------------------------------------
[model]
mechanism               = "dist"      # dist | seq | rand
scale_mode              = "none"     # none | minmax | zscore
length_scale            = 25.0
weight_scheme           = "uniform"  # uniform | inverse_variance | time_weighted
receptors               = []
receptor_kinases        = []
include_tfs_as_proteins = false

# ---------------------------------------------------------------------------
# [optimisation]  – multi-start fitting control
# solver = "lm"     → run_single_optimisation only (classic path)
# solver = "hybrid" → run_hybrid_fit (Phase 0 LHS + Phase 1 evosax + Phase 2 LM + QDax)
# ---------------------------------------------------------------------------
[optimisation]
n_starts   = 5
max_steps  = 500          # LM iteration cap when solver = "lm"
solver     = "lm"      # lm | hybrid
verbose    = false
loss_type  = "mse"
lambda_net = 0.0
reg_lambda = 0.0001
rtol       = 1e-8          # Optimistix convergence rtol
atol       = 1e-8          # Optimistix convergence atol

# ---------------------------------------------------------------------------
# [loss_weights]  – relative weight of each objective term
# ---------------------------------------------------------------------------
[loss_weights]
phospho   = 1.0
abundance = 1.0
mrna      = 1.0
reg       = 1.0

# ---------------------------------------------------------------------------
# [hybrid]  – settings used only when [optimisation] solver = "hybrid"
#
# Phase 0:  Latin Hypercube Sampling warm-start screen
# Phase 1:  evosax global search (CMA-ES family)
# Phase 2:  Optimistix LM polish on top-K evosax candidates
# Phase 3:  QDax MAP-Elites behavioural repertoire (always runs)
# ---------------------------------------------------------------------------
[hybrid]

# ── Phase 0: LHS screen ────────────────────────────────────────────────────
# skip_lhs = true bypasses Phase 0; evosax starts from a random population.
lhs_n_samples = 128    # total LHS draw size
lhs_top_p     = 8     # top-P seeds forwarded to evosax as warm-start
skip_lhs      = false

# ── Phase 1: evosax global search ──────────────────────────────────────────
# es_algo choices:
#   sep_cma_es  – O(n) per step, preferred for dim 50-500  (default)
#   cma_es      – full covariance, preferred for dim ≤ 100
#   de          – Differential Evolution, robust when ODE solve fails often
es_algo          = "sep_cma_es"
es_popsize       = 64
es_n_generations = 200
es_sigma_init    = 0.3    # initial step size in normalised [0,1] space
es_top_k         = 5      # number of LM seeds drawn from final evosax population

# ── Phase 2: LM polish ─────────────────────────────────────────────────────
# These override [optimisation] max_steps / rtol / atol for the hybrid path.
lm_max_steps = 500
lm_rtol      = 1e-8
lm_atol      = 1e-8

# ── General ────────────────────────────────────────────────────────────────
seed    = 0      # master RNG seed (covers LHS, evosax, QDax init)
verbose = true  # per-generation / per-seed progress logging

# ---------------------------------------------------------------------------
# [qdax]  – MAP-Elites behavioural repertoire
# Runs after Phase 2; builds a 2-D grid of parameter sets
# (BD axes: log10 median kinase half-life, log10 median protein half-life).
# Output saved to {output_dir}/{run_prefix}_qdax_repertoire.npz
# ---------------------------------------------------------------------------
[qdax]
n_centroids  = 1024    # Voronoi CVT centroids (grid resolution)
batch_size   = 256     # number of variants evaluated per MAP-Elites iteration
n_iterations = 2000    # total MAP-Elites iterations
iso_sigma    = 0.005   # isoline mutation – perturbation magnitude
line_sigma   = 0.05    # isoline mutation – line interpolation spread

# ---------------------------------------------------------------------------
# [bounds]  – per-parameter rate bounds (used by create_bounds())
# All values must be positive.
# ---------------------------------------------------------------------------
[bounds]
rate_min                = 1e-5
rate_max                = 10.0
protein_degradation_max = 0.5
kinase_rate_max         = 3.0
phosphatase_rate_max    = 5.0
gamma_abs_max           = 2.0
rna_max                 = 10.0
abundance_max           = 5.0

# ---------------------------------------------------------------------------
# [solver]  – Diffrax ODE solver tolerances
# ---------------------------------------------------------------------------
[solver]
rtol      = 1e-6
atol      = 1e-9
max_steps = 32768

# ---------------------------------------------------------------------------
# [time]  – time-point configuration
# ---------------------------------------------------------------------------
[time]
mrna_time_points = [4, 8, 15, 30, 60, 120, 240, 480, 960]
interpolation    = "piecewise_constant"   # piecewise_constant | linear

# ---------------------------------------------------------------------------
# [derived_rates]  – options for data-derived rate functions
# ---------------------------------------------------------------------------
[derived_rates]
s_prod_fn = "softplus"   # softplus | linear
rna_relax = 0.02

# ---------------------------------------------------------------------------
# [analysis]  – downstream analyses to run after fitting
# ---------------------------------------------------------------------------
[analysis]
tune            = false
run_steadystate = true
run_knockouts   = true
run_sensitivity = true