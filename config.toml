# =============================================================================
# PhosCrosstalk configuration file
# =============================================================================
#
# All runtime options live here.
# The CLI should only need:
#
#     phoscrosstalk --config config.toml
#
# ---------------------------------------------------------------------------
# IMPORTANT STRUCTURAL RULE
# ---------------------------------------------------------------------------
#
# The optimisation path has three separate solver/AD layers:
#
#   1. Optimistix least-squares solver
#      Controls parameter fitting, e.g. Levenberg-Marquardt.
#
#   2. Optimistix Jacobian mode
#      Controls how Optimistix differentiates the residual vector:
#
#          jac_mode = "fwd"  → forward-mode AD through residuals
#          jac_mode = "bwd"  → reverse-mode AD through residuals
#
#   3. Diffrax ODE adjoint
#      Controls how gradients pass through the ODE solve.
#
# The critical compatibility rule is:
#
#   jac_mode = "fwd" requires:
#       ode_adjoint = "forward"
#       or, rarely, ode_adjoint = "direct"
#
#   jac_mode = "bwd" requires:
#       ode_adjoint = "recursive"
#       or ode_adjoint = "checkpoint"
#
# DO NOT use:
#
#   jac_mode = "fwd"
#   ode_adjoint = "recursive"
#
# because RecursiveCheckpointAdjoint does not support forward-mode AD.
#
# This was the major structural issue that had to be fixed.
#
# ---------------------------------------------------------------------------
# Recommended production profile for coupled RNA/protein/phosphosite ODEs
# ---------------------------------------------------------------------------
#
# For likely stiff biological systems:
#
#   [optimisation]
#   ls_solver    = "lm"
#   jac_mode     = "fwd"
#   optx_adjoint = "implicit"
#
#   [solver]
#   ode_solver   = "kvaerno4"
#   ode_adjoint  = "forward"
#
# This is the active profile below.
#
# ---------------------------------------------------------------------------
# Alternative profiles
# ---------------------------------------------------------------------------
#
# Fast non-stiff sanity check:
#
#   [solver]
#   ode_solver  = "tsit5"
#   ode_adjoint = "forward"
#   rtol        = 1e-6
#   atol        = 1e-9
#   max_steps   = 32768
#
# Reverse-mode fallback:
#
#   [optimisation]
#   jac_mode = "bwd"
#
#   [solver]
#   ode_solver  = "kvaerno4"
#   ode_adjoint = "recursive"
#
# Use reverse-mode fallback only if forward-mode becomes too slow, too memory
# intensive, or fails because of unsupported JVPs in your model path.
#
# ---------------------------------------------------------------------------
# Do not define duplicate active [solver] or [optimisation] blocks.
# TOML parsers reject duplicate tables.
# Keep alternatives as comments only.
# =============================================================================


# =============================================================================
# [paths] – input files and output directory
# =============================================================================
#
# Required:
#   data
#   ptm_intra
#   ptm_inter
#
# Optional:
#   crosstalk_tsv
#   rna_data
#   tf_net
#   kinase_tsv
#   kea_ks_table
#   unified_graph_pkl
#
# Optional paths can be disabled with:
#
#   key = ""
#
# Notes:
#   - data should contain phosphosite/protein time-series data.
#   - rna_data enables RNA/mRNA coupling.
#   - tf_net enables TF-driven activation terms.
#   - kinase_tsv or kea_ks_table provides kinase-site priors.
#   - unified_graph_pkl is only used if lambda_net > 0.
# =============================================================================
[paths]
data              = "data_timeseries/input1.csv"
ptm_intra         = "data_curated/processed/ptm_intra.db"
ptm_inter         = "data_curated/processed/ptm_inter.db"
output_dir        = "test_dist"

crosstalk_tsv     = ""
rna_data          = "data_timeseries/input3.csv"
tf_net            = "data_interactions/tf_mrna.csv"
kinase_tsv        = "data_interactions/kinase_sites.tsv"
kea_ks_table      = ""
unified_graph_pkl = "data_curated/processed/unified_kinase_graph.gpickle"


# =============================================================================
# [model] – biological model and preprocessing options
# =============================================================================
#
# mechanism:
#   "dist"  – distributive phosphorylation mechanism
#   "seq"   – sequential phosphorylation mechanism
#   "rand"  – random phosphorylation mechanism
#
# scale_mode:
#   "none"      – use values as provided after basic cleaning
#   "minmax"    – min-max scale each trajectory to [0, 1]
#   "log-minmax"– log-transform then min-max scale (useful for skewed data)
#
# weight_scheme:
#   "uniform"          – equal weight for all observed points
#   "inverse_variance" – higher weight for lower-variance measurements
#   "time_weighted"    – emphasize selected time regions, depending on weighting.py
#
# length_scale:
#   Controls spatial/local PTM interaction decay in local crosstalk matrix Cl.
#   Smaller values make local PTM coupling more position-restricted.
#
# receptors:
#   Protein names treated as externally stimulated receptors.
#
# receptor_kinases:
#   Kinase names treated as externally stimulated receptor kinases.
#
# include_tfs_as_proteins:
#   false – only proteins from phospho/protein data enter the model.
#   true  – TF-related proteins may be added when RNA/TF network supports them.
# =============================================================================
[model]
mechanism               = "dist"      # options: "dist" | "seq" | "rand"
scale_mode              = "none"      # options: "none" | "minmax" | "log-minmax"
length_scale            = 25.0
weight_scheme           = "uniform"   # options: uniform, early_emphasis, early_emphasis_moderate, late_emphasis, flat_no_noise

receptors               = ["ABL2", "CLK3", "EGFR", "EPHA2", "ERBB2", "GRK2", "GRK5", "GSK3A", "LYN", "MAP2K2", "MAPK1", "MAPK3", "MET", "ROCK1"]
receptor_kinases        = ["ABL2", "CDK1", "CDK2", "CDK4", "CDK5", "CLK3", "DAPK3", "EGFR", "EPHA2", "ERBB2", "FYN", "GRK2", "GRK5", "GSK3A", "GSK3B", "LYN", "MAP2K1", "MAP2K2", "MAP2K3", "MAP2K4", "MAPK1", "MAPK3", "MAPK8", "MET", "PAK2", "ROCK1", "TTK"]
include_tfs_as_proteins = false


# =============================================================================
# [optimisation] – parameter fitting control
# =============================================================================
#
# n_starts:
#   Number of random starting points for the multi-start optimisation.
#   Increase for rugged loss landscapes.
#
# max_steps:
#   Optimistix iteration cap for each local optimisation run.
#   This is NOT the ODE solver max_steps.
#
# ls_solver:
#   "lm"           – Levenberg-Marquardt. Best default for nonlinear ODE fitting.
#   "gauss_newton" – faster near solution, less stable far from solution.
#   "dogleg"       – trust-region method, useful if LM behaves poorly.
#   "indirect_lm"  – trust-region LM variant; usually more overhead than "lm".
#
# Recommended:
#   ls_solver = "lm"
#
# optx_adjoint:
#   Controls gradients through the Optimistix solve itself.
#   Usually relevant only if differentiating through the fitted solution.
#
#   "implicit"   – recommended default.
#   "checkpoint" – differentiates through iterations; rarely needed here.
#   "recursive"  – alias-style option if your factory supports it.
#
# Recommended:
#   optx_adjoint = "implicit"
#
# jac_mode:
#   Controls how Optimistix computes the residual Jacobian.
#
#   "fwd" – forward-mode Jacobian.
#           Usually best for least-squares residual problems where the parameter
#           vector is moderate and the residual vector is large.
#
#   "bwd" – reverse-mode Jacobian.
#           Use if forward-mode fails or is too expensive.
#
# COMPATIBILITY:
#
#   jac_mode = "fwd" requires:
#       [solver] ode_adjoint = "forward"
#
#   jac_mode = "bwd" requires:
#       [solver] ode_adjoint = "recursive" or "checkpoint"
#
# verbose:
#   false – normal logging
#   true  – Optimistix internal progress logging, can be noisy
#
# loss_type:
#   Currently kept for compatibility. Main fitting path uses residual-vector
#   least squares.
#
# lambda_net:
#   Weight for kinase-network Laplacian regularisation on alpha.
#   Requires unified_graph_pkl.
#   Set 0.0 to disable.
#
# reg_lambda:
#   L2 regularisation on parameter vector theta.
#
# rtol / atol:
#   Optimistix convergence tolerances.
#   These are not ODE tolerances.
# =============================================================================
[optimisation]
n_starts      = 10
max_steps     = 10000

ls_solver     = "lm"         # options: "lm" | "gauss_newton" | "dogleg" | "indirect_lm"

optx_adjoint  = "implicit"   # options: "implicit" | "checkpoint"
jac_mode      = "bwd"        # options: "fwd" | "bwd"

verbose       = true
log_every     = 1          # log diagnostics every N steps for optax-style backends
loss_type     = "mse"

lambda_net    = 0.001
reg_lambda    = 0.0001

rtol          = 1e-6
atol          = 1e-6

# Optimizer backend. Options: "optimistix" (default), "jaxopt_lbfgsb", "jaxopt_pgd",
# "scipy_jax", "scipy_jax_pen", "optax_adam", "optax_sgd", "optax_lbfgs", "mpax".
optimizer_backend = "jaxopt_lbfgsb"


# =============================================================================
# [solver] – Diffrax ODE solver configuration
# =============================================================================
#
# This section controls the ODE integration inside fitting and simulation.
#
# ode_solver:
#
#   Explicit solvers:
#
#     "tsit5"
#         Best first test for non-stiff or mildly stiff systems.
#         Fast, adaptive, good general-purpose explicit RK method.
#
#     "dopri5"
#         Similar family to Tsit5. Useful benchmark, rarely better for this case.
#
#     "dopri8"
#         High-order explicit method. Expensive. Use mainly for high-accuracy
#         non-stiff validation, not routine fitting.
#
#     "bosh3"
#         Lower-order explicit method. Can be useful for rough fast tests.
#
#   Implicit stiff solvers:
#
#     "kvaerno3"
#         Lower-order stiff ESDIRK. More robust than explicit methods, cheaper
#         than Kvaerno4/5, but less accurate.
#
#     "kvaerno4"
#         Best practical default for stiff biological ODE fitting.
#         Recommended active solver for coupled RNA/protein/phosphosite systems.
#
#     "kvaerno5"
#         Higher-order stiff solver. Use for final validation if Kvaerno4 works
#         and you need tighter accuracy. More expensive.
#
# Recommended:
#   ode_solver = "kvaerno4"
#
# ode_adjoint:
#
#   "forward"
#       Required for jac_mode = "fwd".
#       Best default for Optimistix least_squares with LM/Gauss-Newton/Dogleg.
#
#   "recursive"
#       RecursiveCheckpointAdjoint.
#       Recommended reverse-mode Diffrax adjoint.
#       Use with jac_mode = "bwd".
#
#   "checkpoint"
#       Same conceptual role as recursive if your factory maps it that way.
#
#   "direct"
#       Supports both forward and reverse AD, but is usually slower.
#       Use only for special mixed-AD or Hessian/debugging cases.
#
#   "backsolve"
#       Continuous adjoint. Low memory but approximate gradients.
#       Not recommended for main fitting.
#
#   "none"
#       Let Diffrax default behavior apply. Not recommended for this project
#       because explicit configuration prevents AD mismatches.
#
# rtol / atol:
#   ODE adaptive step tolerances.
#
#   Looser:
#       rtol = 1e-5
#       atol = 1e-8
#       faster and usually enough during calibration.
#
#   Tighter:
#       rtol = 1e-6
#       atol = 1e-9
#       better for final validation but slower.
#
# max_steps:
#   Maximum internal ODE solver steps.
#   Increase when using stiff solvers or long simulations.
#
# dt0:
#   Initial step size.
#   For early fast phosphosite dynamics, 0.01 is reasonable.
#   For long steady-state simulations, a larger dt0 may be acceptable.
#
# root_find_max_steps:
#   Used only by implicit solvers such as Kvaerno3/4/5.
#   If implicit stage solves fail, increase from 10 to 20 or 30.
#
# ---------------------------------------------------------------------------
# Active profile below:
#   Stiff biological calibration profile
#   Optimistix jac_mode = "fwd"
#   Diffrax ode_adjoint = "forward"
# ---------------------------------------------------------------------------
[solver]
ode_solver          = "kvaerno4"
ode_adjoint         = "checkpoint"

rtol                = 1e-7
atol                = 1e-7
max_steps           = 131072
dt0                 = 1e-4
root_find_max_steps = 20


# =============================================================================
# Alternative solver profiles
# =============================================================================
#
# Keep these commented. Do not create duplicate active [solver] or [optimisation]
# sections in TOML.
#
# ---------------------------------------------------------------------------
# Profile A: fast non-stiff sanity check
# ---------------------------------------------------------------------------
#
# Use this first when debugging shapes, data loading, and residual construction.
# If it works and is stable, it may be enough.
#
# [optimisation]
# jac_mode     = "fwd"
# ls_solver    = "lm"
# optx_adjoint = "implicit"
#
# [solver]
# ode_solver          = "tsit5"
# ode_adjoint         = "forward"
# rtol                = 1e-6
# atol                = 1e-9
# max_steps           = 32768
# dt0                 = 0.01
# root_find_max_steps = 10
#
# ---------------------------------------------------------------------------
# Profile B: main stiff biological fit
# ---------------------------------------------------------------------------
#
# This is the active profile in this file.
#
# [optimisation]
# jac_mode     = "fwd"
# ls_solver    = "lm"
# optx_adjoint = "implicit"
#
# [solver]
# ode_solver          = "kvaerno4"
# ode_adjoint         = "forward"
# rtol                = 1e-5
# atol                = 1e-8
# max_steps           = 131072
# dt0                 = 0.01
# root_find_max_steps = 20
#
# ---------------------------------------------------------------------------
# Profile C: higher-accuracy stiff final validation
# ---------------------------------------------------------------------------
#
# Use after obtaining a good fit. More expensive.
#
# [solver]
# ode_solver          = "kvaerno5"
# ode_adjoint         = "forward"
# rtol                = 1e-6
# atol                = 1e-9
# max_steps           = 131072
# dt0                 = 0.01
# root_find_max_steps = 20
#
# ---------------------------------------------------------------------------
# Profile D: reverse-mode fallback
# ---------------------------------------------------------------------------
#
# Use if forward-mode AD fails or is too expensive.
#
# [optimisation]
# jac_mode     = "bwd"
# ls_solver    = "lm"
# optx_adjoint = "implicit"
#
# [solver]
# ode_solver          = "kvaerno4"
# ode_adjoint         = "recursive"
# rtol                = 1e-5
# atol                = 1e-8
# max_steps           = 131072
# dt0                 = 0.01
# root_find_max_steps = 20
#
# ---------------------------------------------------------------------------
# Profile E: not recommended except for debugging mixed AD
# ---------------------------------------------------------------------------
#
# DirectAdjoint supports both forward and reverse AD but is usually slower.
#
# [solver]
# ode_solver          = "tsit5"
# ode_adjoint         = "direct"
# rtol                = 1e-6
# atol                = 1e-9
# max_steps           = 32768
# dt0                 = 0.01
# root_find_max_steps = 10
#
# ---------------------------------------------------------------------------
# Profile F: avoid for main fitting
# ---------------------------------------------------------------------------
#
# BacksolveAdjoint gives approximate gradients. Do not use as the default
# calibration path.
#
# [solver]
# ode_solver          = "tsit5"
# ode_adjoint         = "backsolve"
# rtol                = 1e-6
# atol                = 1e-9
# max_steps           = 32768
# dt0                 = 0.01
# root_find_max_steps = 10


# =============================================================================
# [loss_weights] – relative weight of each residual block
# =============================================================================
#
# These weights are baked into the residual vector as sqrt(weight) factors:
#
#   residual = sqrt(weight * element_weight) * (simulation - observation)
#
# Therefore least-squares minimises the weighted sum of squared residuals.
#
# phospho:
#   Weight for phosphosite trajectories.
#
# abundance:
#   Weight for protein abundance trajectories.
#
# mrna:
#   Weight for RNA / R_rna trajectories.
#
# reg:
#   Weight multiplier for regularisation block if applied in the objective path.
#
# Practical advice:
#   - Start with all 1.0.
#   - If phosphosite fit dominates and RNA is ignored, increase mrna.
#   - If RNA dominates and phosphosite fit gets poor, reduce mrna.
#   - Keep reg modest unless parameters become biologically implausible.
# =============================================================================
[loss_weights]
phospho   = 1.0
abundance = 5.0
mrna      = 2.0
reg       = 1.0


# =============================================================================
# [bounds] – parameter bounds used by create_bounds()
# =============================================================================
#
# All values must be positive.
#
# rate_min:
#   Log-space floor for ALL positive kinetic rate parameters.
#
# rate_max:
#   Generic ceiling; only used where no dedicated ceiling exists.
#
# k_deact_max:
#   Upper bound for k_deact (protein deactivation rates).
#   Kept separate from rate_max so it can be constrained tightly.
#
# protein_degradation_max:
#   Upper bound for d_deg (protein degradation rates).
#
# beta_coupling_max:
#   Upper bound for beta_g and beta_l (crosstalk coupling scalars).
#   Separate from rate_max to prevent unrealistically large coupling.
#
# alpha_min:
#   Lower bound for alpha (kinase-site activation strengths).
#   Prevents collapse near zero, which would silence kinase contributions.
#
# kinase_rate_max:
#   Upper bound for kK_act and kK_deact.
#
# phosphatase_rate_max:
#   Upper bound for k_off (phosphosite dephosphorylation rates).
#
# gamma_abs_max:
#   Absolute bound for raw gamma parameters (tanh-encoded; NOT log-space).
#
# rna_max:
#   Hard clip for R_rna in make_rhs(); NOT a parameter bound for create_bounds().
#
# abundance_max:
#   Hard clip for protein abundance A in make_rhs() / simulation;
#   NOT a parameter bound for create_bounds().
# =============================================================================
[bounds]
# ── Floor / generic ceiling ──────────────────────────────────────────────────
rate_min                = 1e-4    # log-space floor for ALL positive rate params
rate_max                = 10.0    # generic ceiling; only used where no dedicated ceiling exists

# ── Protein parameters ───────────────────────────────────────────────────────
k_deact_max             = 2.0     # k_deact ceiling, separate from rate_max
                                  # half-life floor = ln2/2 ≈ 0.35 min
protein_degradation_max = 10.0    # d_deg ceiling

# ── Crosstalk coupling ───────────────────────────────────────────────────────
beta_coupling_max       = 3.0     # ceiling for beta_g and beta_l

# ── Kinase parameters ────────────────────────────────────────────────────────
alpha_min               = 0.01    # alpha lower bound; prevents collapse near zero
kinase_rate_max         = 1.0     # kK_act / kK_deact ceiling

# ── Phosphosite parameters ───────────────────────────────────────────────────
phosphatase_rate_max    = 5.0     # k_off ceiling

# ── Gamma parameters, tanh raw, NOT log-encoded ──────────────────────────────
gamma_abs_max           = 4.0     # raw input to 2*tanh(); decoded range ≈ (-2, +2)

# ── make_rhs() / simulation clip values, NOT create_bounds() parameter bounds ─
rna_max                 = 10.0    # R_rna hard clip in make_rhs(); not a param bound
abundance_max           = 5.0     # A hard clip in make_rhs() / simulation; not a param bound


# =============================================================================
# [time] – time-point and interpolation options
# =============================================================================
#
# mrna_time_points:
#   RNA sampling time points.
#   Used when RNA data is provided and matched to model proteins.
#
# interpolation:
#   "piecewise_constant"
#       Holds input values constant between observed time points.
#       More robust for sparse biological time-series.
#
#   "linear"
#       Linear interpolation between observed time points.
#       Smoother but can introduce artificial intermediate dynamics.
#
# Recommended:
#   piecewise_constant for sparse omics time series.
# =============================================================================
[time]
mrna_time_points = [4, 8, 15, 30, 60, 120, 240, 480, 960]
interpolation    = "piecewise_constant"   # options: "piecewise_constant" | "linear"


# =============================================================================
# [derived_rates] – data-derived rate functions
# =============================================================================
#
# s_prod_fn:
#   "softplus"
#       Positive smooth production function.
#       Recommended because it avoids negative production rates.
#
#   "linear"
#       Direct linear form.
#       Use only if you explicitly want signed/linear behavior and have guards.
#
# rna_relax:
#   Relaxation strength for RNA/R_rna dynamics.
#
#   Smaller values:
#       slower RNA relaxation, smoother trajectories.
#
#   Larger values:
#       faster RNA tracking, potentially stiffer dynamics.
#
# For stiff coupled RNA/protein/phosphosite models, high rna_relax can make
# explicit solvers struggle.
# =============================================================================
[derived_rates]
s_prod_fn = "softplus"   # options: "softplus" | "linear"
rna_relax = 0.1


# =============================================================================
# [analysis] – downstream analyses after fitting
# =============================================================================
#
# tune:
#   Hyperparameter scan before final fitting.
#
# run_steadystate:
#   Long-horizon simulation to study convergence/relaxation.
#
# run_knockouts:
#   In-silico knockout screen.
#
# run_sensitivity:
#   Global sensitivity analysis.
#
# Practical advice:
#   During solver debugging, set all to false.
#   After fitting is stable, enable analyses one by one.
# =============================================================================
[analysis]
tune            = false
run_steadystate = true
run_knockouts   = true
run_sensitivity = true


# =============================================================================
# [runtime] – CPU / XLA threading configuration
# =============================================================================
#
# These settings control how many CPU threads JAX/XLA and BLAS libraries use.
# They are applied BEFORE JAX is imported, so they are truly effective.
#
# cpu_threads
# -----------
#   "auto"  (default)
#       Auto-detect the total CPU budget in priority order:
#         1. SLURM_CPUS_PER_TASK  – set automatically by srun/sbatch
#         2. os.sched_getaffinity – Linux affinity mask (cgroups/container aware)
#         3. psutil.cpu_count     – physical cores (if psutil installed)
#         4. os.cpu_count()       – all logical CPUs visible to the process
#
#   <positive integer>
#       Explicit override.  Example: cpu_threads = 8
#
# parallel_starts
# ---------------
#   "auto"  (default)
#       Derived from cpu_threads and threads_per_start.
#       When n_starts == 1 this is always 1 (all threads to the single run).
#
#   <positive integer>
#       Pin the number of concurrent optimisation starts.
#
# threads_per_start
# -----------------
#   "auto"  (default)
#       Derived from cpu_threads and parallel_starts.
#
#   <positive integer>
#       Pin the per-start thread count.
#
# use_physical_cores
# ------------------
#   true  (default)
#       When SLURM_CPUS_PER_TASK is not set, use detected physical cores
#       (not logical/HT CPUs) as the parallelism budget.  Reduces
#       oversubscription on hyperthreaded CPUs.
#
#   false
#       Use all logical CPUs (original behaviour).
#
# reserve_cores
# -------------
#   0  (default)
#       Reserve this many CPUs for the OS / parent process.
#
# parallel_frechet
# ----------------
#   "auto"  (default)
#       Parallelise Fréchet diagnostics only when solutions > 2 and
#       parallel_starts > 1.
#
#   true / false
#       Always / never parallelise.
#
# Affected environment variables (set via os.environ.setdefault for
# setup_cpu_env, so externally set values are preserved):
#
#   JAX_PLATFORMS            → "cpu"
#   XLA_FLAGS                → --xla_cpu_multi_thread_eigen=true
#                               intra_op_parallelism_threads=<threads_per_start>
#   OMP_NUM_THREADS          → <threads_per_start>
#   OPENBLAS_NUM_THREADS     → <threads_per_start>
#   MKL_NUM_THREADS          → <threads_per_start>
#   VECLIB_MAXIMUM_THREADS   → <threads_per_start>
#   NUMBA_NUM_THREADS        → <threads_per_start>
#   NUMEXPR_NUM_THREADS      → <threads_per_start>
#
# SLURM example
# -------------
#   srun --cpus-per-task=16 --ntasks=1 phoscrosstalk --config config.toml
#
#   With cpu_threads = "auto" and n_starts = 8 the planner reads
#   SLURM_CPUS_PER_TASK=16 and may decide:
#       parallel_starts  = 4
#       threads_per_start = 4
#   so each of the 4 workers uses 4 threads (total = 16).
#
# Workstation example (32 physical / 64 logical CPUs, n_starts = 20)
# -------------------------------------------------------------------
#   With all settings "auto" the planner detects 32 physical cores and
#   with default_threads_per_run=4 may decide:
#       parallel_starts  = 8
#       threads_per_start = 4
#   so 8 starts run in parallel, each using 4 threads (total = 32).
#
# =============================================================================
[runtime]
cpu_threads = "auto"
parallel_starts = "auto"
threads_per_start = "auto"
use_physical_cores = true
reserve_cores = 0
parallel_frechet = "auto"


# =============================================================================
# [steadystate] – long-horizon relaxation analysis
# =============================================================================
#
# Used only when:
#
#   [analysis]
#   run_steadystate = true
#
# Purpose:
#   Simulates the fitted model beyond the observed time window to study whether
#   phosphosite, protein, kinase, and RNA states converge or diverge.
#
# t_end:
#   Final simulation time in minutes.
#
# early_end:
#   End of dense early-time grid.
#
# n_early:
#   Number of points in [0, early_end].
#
# n_late:
#   Number of points in (early_end, t_end].
#
# late_grid:
#   "geomspace"
#       More points near early late-time transition, fewer near t_end.
#       Recommended for relaxation.
#
#   "linear"
#       Uniform late-time grid.
#
# rtol / atol:
#   ODE tolerances for steady-state simulation.
#   Separate from fitting solver tolerances.
#
# dt0:
#   Initial ODE step for steady-state simulation.
#   Can be larger than fitting dt0 because the simulation is long-horizon.
#
# max_steps:
#   Long-horizon simulations need a large step cap.
#
# top_n:
#   Number of top trajectories shown in plots.
#
# skip_plots_on_nonfinite:
#   true prevents plotting crashes when all outputs are NaN/non-finite.
#
# strict:
#   false – log warnings on non-finite steady-state results.
#   true  – raise RuntimeError on non-finite results.
# =============================================================================
[steadystate]
t_end                    = 100000.0
early_end                = 100.0
n_early                  = 100
n_late                   = 80
late_grid                = "geomspace"  # options: "geomspace" | "linear"

rtol                     = 1e-6
atol                     = 1e-8
dt0                      = 0.1
max_steps                = 131072

top_n                    = 10
skip_plots_on_nonfinite  = true
strict                   = false

# Diffrax steady-state event termination.
# use_event = true  → run_steadystate_analysis() uses diffrax.steady_state_event()
#                     to stop the ODE integration when the system converges.
# use_event = false → falls back to the legacy simulate() path (long fixed horizon).
# event_rtol / event_atol:
#   Relative/absolute tolerance for the steady-state event.
#   null → inherit from [steadystate] rtol / atol above.
use_event   = true
event_rtol  = 1e-5   # null → use [steadystate] rtol
event_atol  = 1e-8   # null → use [steadystate] atol


# =============================================================================
# [simulation] – dense continuous output after fitting
# =============================================================================
#
# These settings control post-fit forward simulation used for smooth
# visualisation and dashboard export.  They do NOT affect the optimisation
# loss, objective, or fitted parameters in any way.
#
# dense_output:
#   true  – run an additional dense-grid forward simulation after fitting.
#   false – skip dense output (saves time; fit_timeseries_dense.tsv not written).
#
# dense_n_points:
#   Number of uniformly-spaced time points in [0, t_max_observed].
#   Increase for smoother plots; 200 is a good default.
#
# dense_interpolation:
#   Label written to the interpolation_method column in fit_timeseries_dense.tsv.
#   Used for provenance / filtering in downstream analysis.
#
# save_dense:
#   true  – write fit_timeseries_dense.tsv to the output directory.
#   false – skip the file write even if dense simulation ran successfully.
# =============================================================================
[simulation]
dense_output        = true
dense_n_points      = 1000
dense_interpolation = "diffrax_dense"
save_dense          = true


# =============================================================================
# [data_interpolation] – diagnostic interpolation of observed sparse data
# =============================================================================
#
# This section controls interpolated observed-data curves written to
# fit_timeseries_dense.tsv with series_type = "observed_interpolated_dense".
# It is NOT used in the loss function and does NOT expand training targets.
# The original sparse observed arrays in the loss are never modified.
#
# enabled:
#   false (default) – skip diagnostic data interpolation.
#   true            – add interpolated observed curves to the dense output TSV.
#
# method:
#   "linear"         – piecewise linear interpolation.  Safe for NaN-heavy data.
#   "cubic_hermite"  – smooth cubic interpolation via Hermite splines.
#                      Requires fewer NaNs for a stable result.
#
# fill_forward_nans_at_end:
#   false (default) – leave NaNs beyond the final observed point as NaN.
#   true            – forward-fill the last observed value past the final
#                     non-NaN time point (applies to the interpolated curve only).
#
# replace_nans_at_start:
#   null (default)  – leave NaNs before the first observed point as NaN.
#   "zero"          – fill with zero before the first observation.
#   "first_valid"   – repeat the first valid observed value.
# =============================================================================
[data_interpolation]
enabled                 = true
method                  = "cubic_hermite"   # options: "linear" | "cubic_hermite"
fill_forward_nans_at_end = false
replace_nans_at_start   = "first_valid"   # null | "zero" | "first_valid"


# =============================================================================
# [neural_ode] – post-fit neural latent-rate refinement (optional)
# =============================================================================
#
# After the main mechanistic fit, an optional neural refinement stage can be
# enabled to learn improved latent rate functions k_hat_act(t) and
# s_hat_prod(t), regularised toward the mechanistic priors k_act_init(t) and
# s_prod_init(t).
#
# The mechanistic ODE equations and theta_best are kept fixed.
# Only the neural rate generator parameters (two small MLPs) are optimised.
#
# enabled:
#   false (default) – skip neural refinement entirely.  Normal flow unchanged.
#   true            – run post-fit refinement after mechanistic analysis.
#
# width:
#   MLP hidden layer width (number of units per hidden layer).
#
# depth:
#   Number of hidden layers in each MLP.
#
# steps:
#   Number of Optimistix GradientDescent training steps.
#
# learning_rate:
#   Gradient-descent step size.
#
# prior_weight_k_act / prior_weight_s_prod:
#   Regularisation weights anchoring learned rates to mechanistic priors.
#   Higher values = learned rates stay closer to mechanistic priors.
#
# data_weight_phospho / data_weight_abundance / data_weight_mrna:
#   Relative weights for each data modality in the neural training loss.
#
# seed:
#   JAX random seed for neural network weight initialisation.
#
# rtol / atol / dt0 / max_steps:
#   Diffrax ODE tolerances and step limits used during neural training.
#   These do NOT affect the mechanistic fitting solver.
#
# save_dense:
#   true  – write neural_fit_timeseries_dense.tsv for dashboard visualisation.
#   false – skip dense output.
#
# dense_n_points:
#   Number of time points in the dense neural output grid.
# =============================================================================
[neural_ode]
use_optax               = true
optimizer               = "adabelief"
optax_loop              = "scan"
print_every             = 250

enabled                 = true
width                   = 64
depth                   = 2
steps                   = 200
learning_rate           = 1e-3

prior_weight_k_act      = 1.0
prior_weight_s_prod     = 1.0
data_weight_phospho     = 1.0
data_weight_abundance   = 1.0
data_weight_mrna        = 1.0

seed                    = 0

rtol                    = 1e-4
atol                    = 1e-6
dt0                     = 0.02
max_steps               = 4096

save_dense              = false
dense_n_points          = 100


# =============================================================================
# [pinn] – PINN / Universal ODE augmentation mode (optional)
# =============================================================================
#
# When enabled = false (default): existing mechanistic optimisation and
# post-fit neuralODE workflow run exactly as before.  No existing behaviour
# changes.
#
# When enabled = true: mechanistic multistart optimisation and post-fit
# neuralODE refinement are BYPASSED.  A single-start PINN joint optimisation
# is run instead.  This is an ALTERNATIVE run mode, not an additional step.
#
# WARNING:
#   PINN mode bypasses mechanistic multistart and post-fit neuralODE.
#   It is an alternative run mode, not an additional post-processing step.
#
# Architecture
# ------------
# width_size:
#   Hidden layer width of the PINN MLP.
# depth:
#   Number of hidden layers (>= 1).
# activation:
#   Activation function: "tanh" | "relu" | "gelu" | "silu" | "softplus" | "elu"
#
# Regularisation
# --------------
# lambda_pinn:
#   Weight for the PINN neural regularisation term.  Higher values constrain
#   the neural correction more strongly toward zero.
# regularize:
#   "residual_l2"  – regularise by mean L2 of neural correction over trajectory.
#   "param_l2"     – regularise by L2 of network parameters.
#
# Optimisation
# ------------
# max_steps:
#   Number of Optax training steps.
# learning_rate:
#   Adam optimiser learning rate.
# rtol / atol:
#   ODE solver tolerances used during PINN training.
# seed:
#   Random seed for PINN weight initialisation.
# print_every:
#   Log progress every N steps.
# grad_clip:
#   Global gradient norm clip (0 to disable).
#
# Runtime
# -------
# use_max_machine_threads:
#   When true, use the maximum available CPU budget for the single PINN run
#   through the existing runtime planning infrastructure.
# =============================================================================
[pinn]
enabled                 = false   # set to true to activate PINN mode

# Architecture
width_size              = 64
depth                   = 2
activation              = "tanh"  # options: "tanh" | "relu" | "gelu" | "silu" | "softplus" | "elu"

# Regularisation
lambda_pinn             = 0.5
regularize              = "residual_l2"   # options: "residual_l2" | "param_l2"

# Optimisation
max_steps               = 100
learning_rate           = 1e-3
rtol                    = 1e-8
atol                    = 1e-8
seed                    = 0
verbose                 = true
print_every             = 1
grad_clip               = 1.0
optimizer               = "adabelief"

# Runtime
use_max_machine_threads = true


[debug]
save_jaxpr_reports = true